name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit and Streamlit smoke tests
        run: python -m pytest -q
      - name: Validate committed Top-200 snapshot
        run: python scripts/validate_snapshot.py --strict

  live-collection:
    # A temporary runner directory has no last-good cache. The job therefore
    # succeeds only when the providers return a fresh, cross-validated Top 200.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Collect a fresh Top-200 snapshot without a cache
        run: python scripts/update_data.py --data-dir "$RUNNER_TEMP/stocklens-live"
      - name: Validate the fresh snapshot
        run: python scripts/validate_snapshot.py --strict --data-dir "$RUNNER_TEMP/stocklens-live"

  live-valuation-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Prepare isolated snapshot directory
        run: |
          mkdir -p "$RUNNER_TEMP/stocklens-valuation"
          cp data/universe.csv data/status.json "$RUNNER_TEMP/stocklens-valuation/"
      - name: Calculate point-in-time sample valuations
        run: >-
          python scripts/update_valuations.py
          --data-dir "$RUNNER_TEMP/stocklens-valuation"
          --tickers GOOGL AMAT AVGO QCOM
          --allow-partial
      - name: Validate the four-company sample
        run: >-
          python scripts/validate_valuations.py
          --data-dir "$RUNNER_TEMP/stocklens-valuation"
          --allow-partial
          --require-tickers GOOGL AMAT AVGO QCOM
      - uses: actions/upload-artifact@v4
        with:
          name: valuation-sample
          path: |
            ${{ runner.temp }}/stocklens-valuation/financials.csv
            ${{ runner.temp }}/stocklens-valuation/valuations.csv
            ${{ runner.temp }}/stocklens-valuation/valuation_status.json
          retention-days: 7
