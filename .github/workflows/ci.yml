name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-tests:
    name: code-tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-personal.txt
      - name: Run non-Streamlit tests
        run: python -m pytest -q -m "not streamlit"
      - name: Run Streamlit AppTests with a hard timeout
        run: python scripts/run_streamlit_apptests.py --timeout-seconds 180

  stored-snapshot-integrity:
    name: stored-snapshot-integrity (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Validate committed Top-200 snapshot integrity
        # A committed snapshot is a reproducible historical artifact. Current
        # market-session freshness is not inferred from this offline check.
        run: python scripts/validate_snapshot.py
