name: Refresh StockLens data

on:
  workflow_dispatch:
  schedule:
    # 23:15 UTC is after the regular US close in both EST and EDT.
    - cron: "15 23 * * 1-5"

permissions:
  contents: read

concurrency:
  group: stocklens-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Refresh last-good snapshot
        run: python scripts/update_data.py
      - name: Validate refreshed snapshot
        run: python scripts/validate_snapshot.py --strict
      - name: Refresh SEC financials and valuations
        run: python scripts/update_valuations.py
      - name: Validate valuation snapshot
        run: python scripts/validate_valuations.py
      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- data/; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.csv data/status.json data/financials.csv data/valuations.csv data/valuation_history.csv data/valuation_status.json
          git commit -m "data: refresh StockLens 200 snapshot"
          git push
